<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prévia local — revisão da IA</title>
    <link rel="stylesheet" href="../../app/estilos.css" />
    <link rel="stylesheet" href="../../app/online.css" />
  </head>
  <body>
    <script>
      // Dados ilustrativos: a estrutura e os estilos vêm do modal real do app.
      window.MODO_ONLINE = true;
      window.IA_ATIVA = true;
      window.esc = (s) =>
        String(s ?? "").replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      window.toast = () => {};
      window.abrirLightbox = (src) => window.open(src, "_blank");
      const imagem =
        "data:image/svg+xml," +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800"><rect width="600" height="800" fill="#e9ddc4"/><rect x="35" y="38" width="530" height="724" fill="#f5ecd7" stroke="#9f8d6f"/><text x="70" y="125" font-family="Georgia" font-size="28" fill="#3b3022">Dear reader,</text><text x="70" y="180" font-family="Georgia" font-size="22" fill="#3b3022">He changed all the letters</text><text x="70" y="220" font-family="Georgia" font-size="22" fill="#3b3022">in the lines that he found.</text><text x="70" y="260" font-family="Georgia" font-size="22" fill="#3b3022">He checked all the colors</text><text x="70" y="300" font-family="Georgia" font-size="22" fill="#3b3022">of the spines.</text><circle cx="385" cy="580" r="85" fill="#8d6d58" opacity=".35"/></svg>',
        );
      window.DADOS = {
        fichas: [
          {
            id: "f24",
            titulo: "Pista importada",
            paginas: [{ imagem, original: "", traducao: "", explica: "" }],
            personagens: [],
            grupos: [],
          },
        ],
        salas: [],
        personagens: [{ nome: "Herbert" }],
        grupos: [{ nome: "Biblioteca" }, { nome: "Família" }],
      };
    </script>
    <script src="../../app/ia.js"></script>
    <script>
      IA.imagens = async () => ({ urls: [imagem], avisos: [] });
      IA.chamar = async () => ({
        resultado: {
          titulo: "Letras e Dicionário — Mudanças",
          paginas: [
            {
              transcricao:
                "He changed all the letters in the lines that he found,\nHe checked all the colors of the spines that were bound.",
              traducao:
                "Ele mudou todas as letras nas linhas que encontrou,\nEle verificou todas as cores das lombadas que estavam presas.",
            },
          ],
          resumo:
            "O texto descreve mudanças nas letras, nas cores das lombadas e no significado de saudações e expressões.",
          personagens_existentes: ["Herbert"],
          personagens_novos: ["Daniel"],
          grupo: "",
          grupo_sugerido: "Correspondências",
        },
        uso: { entrada: 2080, saida: 1138 },
        modelo: "gpt-5-nano",
      });
      IA.processar("f24").then(() => {
        if (new URLSearchParams(location.search).has("bottom")) {
          const corpo = document.querySelector(".ia-review-body");
          corpo.scrollTop = corpo.scrollHeight;
        }
        if (new URLSearchParams(location.search).has("diag")) {
          document.title = `VW=${innerWidth} SW=${document.documentElement.scrollWidth}`;
        }
      });
    </script>
  </body>
</html>
