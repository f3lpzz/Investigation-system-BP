<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Prince — Painel de Pistas</title>
<style>
  :root{
    --bg:#0c1a33;
    --bg2:#0f2244;
    --grid:rgba(120,170,255,.10);
    --line:#5b8def;
    --ink:#e8eefc;
    --ink-soft:#9fb3d8;
    --panel:#0e2ops;
    --panel:#11264d;
    --card:#13305f;
    --card-edge:#2a5298;
    /* cores por tipo */
    --t-sala:#5ec8ff;
    --t-pista:#ffd35e;
    --t-carta:#a98bff;
    --t-pessoa:#ff7e9a;
    --t-mecanica:#5effc0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      linear-gradient(var(--grid) 1px,transparent 1px) 0 0/26px 26px,
      linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/26px 26px,
      radial-gradient(1200px 700px at 70% -10%,#15336a,transparent),
      var(--bg);
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  header{
    padding:14px 20px 10px;border-bottom:1px solid #21407a;
    background:linear-gradient(180deg,#0d214480,#0c1a3300);
    backdrop-filter:blur(3px);
  }
  .title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .title h1{font-size:20px;margin:0;letter-spacing:.5px;font-weight:600}
  .title .sub{color:var(--ink-soft);font-size:13px}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .search{
    flex:1;min-width:200px;display:flex;align-items:center;gap:8px;
    background:#0c1f40;border:1px solid #284b8c;border-radius:9px;padding:8px 12px;
  }
  .search input{
    border:0;background:transparent;color:var(--ink);outline:none;width:100%;font-size:14px;
  }
  select{
    background:#0c1f40;color:var(--ink);border:1px solid #284b8c;border-radius:9px;
    padding:8px 10px;font-size:13px;outline:none;cursor:pointer;
  }
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{
    border:1px solid #2c5198;background:#102a55;color:var(--ink-soft);
    padding:6px 11px;border-radius:20px;font-size:12px;cursor:pointer;
    display:flex;align-items:center;gap:6px;user-select:none;transition:.15s;
  }
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip.active{color:#06122a;font-weight:600}
  .chip[data-tipo="sala"].active{background:var(--t-sala);border-color:var(--t-sala)}
  .chip[data-tipo="pista"].active{background:var(--t-pista);border-color:var(--t-pista)}
  .chip[data-tipo="carta"].active{background:var(--t-carta);border-color:var(--t-carta)}
  .chip[data-tipo="pessoa"].active{background:var(--t-pessoa);border-color:var(--t-pessoa)}
  .chip[data-tipo="mecanica"].active{background:var(--t-mecanica);border-color:var(--t-mecanica)}
  .viewtoggle{display:flex;border:1px solid #2c5198;border-radius:9px;overflow:hidden}
  .viewtoggle button{
    background:#0c1f40;color:var(--ink-soft);border:0;padding:8px 14px;cursor:pointer;font-size:13px;
  }
  .viewtoggle button.active{background:var(--line);color:#06122a;font-weight:600}
  main{flex:1;position:relative;overflow:hidden}
  /* GRADE */
  #grade{height:100%;overflow:auto;padding:18px;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-content:start}
  .card{
    background:linear-gradient(180deg,#163a72,#102950);
    border:1px solid var(--card-edge);border-left-width:4px;border-radius:11px;
    padding:12px;cursor:pointer;transition:.15s;position:relative;overflow:hidden;
  }
  .card:hover{transform:translateY(-2px);border-color:var(--line);box-shadow:0 6px 22px #00102e80}
  .card[data-tipo="sala"]{border-left-color:var(--t-sala)}
  .card[data-tipo="pista"]{border-left-color:var(--t-pista)}
  .card[data-tipo="carta"]{border-left-color:var(--t-carta)}
  .card[data-tipo="pessoa"]{border-left-color:var(--t-pessoa)}
  .card[data-tipo="mecanica"]{border-left-color:var(--t-mecanica)}
  .card .tag{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);padding-right:24px}
  .card h3{margin:4px 0 6px;font-size:15px;line-height:1.25;padding-right:24px}
  .card .thumbwrap{position:relative;height:120px;border-radius:7px;margin:6px 0;overflow:hidden;
    background:repeating-linear-gradient(45deg,#0a1c3a,#0a1c3a 8px,#0c2042 8px,#0c2042 16px);
    border:1px solid #24467f;display:flex;align-items:center;justify-content:center}
  .card .thumbwrap .ph{font-size:11px;color:#5e79ad;display:flex;flex-direction:column;align-items:center;gap:3px}
  .card .thumbwrap .ph b{font-size:20px;opacity:.6}
  .card .thumbwrap img.thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0a1c3a}
  .card .excerpt{font-size:12px;color:var(--ink-soft);line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .pill{font-size:10px;background:#0d2348;border:1px solid #2b5095;color:var(--ink-soft);
    padding:2px 7px;border-radius:10px}
  .empty{grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:14px}
  /* MAPA */
  #mapa{position:absolute;inset:0;display:none;background:#0b1c3a}
  #mapa svg{width:100%;height:100%;cursor:grab}
  .legend{position:absolute;left:16px;bottom:16px;background:#0c1f40d0;border:1px solid #2b5095;
    border-radius:10px;padding:10px 12px;font-size:11px;color:var(--ink-soft);display:flex;
    flex-direction:column;gap:5px}
  .legend .row{display:flex;align-items:center;gap:7px}
  .legend .dot{width:10px;height:10px;border-radius:50%}
  .hint{position:absolute;right:16px;top:12px;background:#0c1f40c0;border:1px solid #2b5095;
    border-radius:8px;padding:6px 10px;font-size:11px;color:var(--ink-soft)}
  /* PAINEL LATERAL */
  #drawer{
    position:absolute;top:0;right:0;height:100%;width:min(440px,92vw);
    background:linear-gradient(180deg,#0f2750,#0b1c3a);border-left:1px solid #2c5198;
    transform:translateX(102%);transition:.25s;overflow:auto;z-index:20;
    box-shadow:-12px 0 40px #00081e80;
  }
  #drawer.open{transform:translateX(0)}
  .dh{padding:16px 18px;border-bottom:1px solid #21407a;position:sticky;top:0;
    background:#0f2750f0;backdrop-filter:blur(4px)}
  .dh .close{float:right;background:#10294f;border:1px solid #2c5198;color:var(--ink);
    width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
  .dh .tipo{font-size:11px;text-transform:uppercase;letter-spacing:1px}
  .dh h2{margin:6px 0 0;font-size:19px}
  .db{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
  .db img{width:100%;border-radius:10px;border:1px solid #2b5095}
  .field .lab{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--line);margin-bottom:5px}
  .field .val{font-size:14px;line-height:1.5}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .orig{background:#0a1c3a;border:1px solid #24467f;border-radius:8px;padding:10px;font-size:13px;line-height:1.5}
  .trad{background:#102a55;border:1px solid #2c5198;border-radius:8px;padding:10px;font-size:13px;line-height:1.5}
  .taglist{display:flex;gap:6px;flex-wrap:wrap}
  .taglist .t{font-size:12px;padding:4px 9px;border-radius:13px;cursor:pointer;border:1px solid}
  .t.pessoa{background:#3a1726;border-color:var(--t-pessoa);color:#ffb9c8}
  .t.sala{background:#0d2c3f;border-color:var(--t-sala);color:#bfe8ff}
  .t.simb{background:#2c2705;border-color:var(--t-pista);color:#ffe9a8}
  .t.conx{background:#241a3f;border-color:var(--t-carta);color:#d7c8ff}
  @media(max-width:640px){.twocol{grid-template-columns:1fr}}
  /* --- edicao / botoes / toast --- */
  .topbtn{background:#0c1f40;color:var(--ink);border:1px solid #2c5198;border-radius:9px;padding:8px 12px;cursor:pointer;font-size:13px}
  .topbtn:hover{border-color:var(--line)}
  .topbtn.save.dirty{background:var(--t-mecanica);color:#06122a;border-color:var(--t-mecanica);font-weight:600}
  #saveDot{display:none;color:#ff5d7a;margin-left:1px}
  .dactions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .dbtn{background:#10294f;border:1px solid #2c5198;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
  .dbtn:hover{border-color:var(--line)}
  .dbtn.del{border-color:#7a2a3a;color:#ffb9c8;background:#2a1018}
  .dbtn.del:hover{background:#3a1622}
  .dbtn.save{background:#13402a;border-color:var(--t-mecanica);color:#bfffe2}
  .edinput{width:100%;background:#0a1c3a;border:1px solid #2c5198;color:var(--ink);border-radius:7px;padding:8px;font-size:13px;font-family:inherit}
  .edarea{min-height:64px;resize:vertical;line-height:1.5}
  .editbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#11264d;border:1px solid var(--line);color:var(--ink);padding:12px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;max-width:80vw;text-align:center;z-index:50}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .mapbtn{position:absolute;right:16px;top:44px;background:#0c1f40d8;border:1px solid #2b5095;color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;z-index:5}
  .mapbtn:hover{border-color:var(--line)}
  .minimap{position:absolute;right:16px;bottom:16px;width:170px;height:120px;background:#0a1830e0;border:1px solid #2b5095;border-radius:10px;overflow:hidden;z-index:5}
  .minimap svg{width:100%;height:100%;cursor:pointer;display:block}
  /* gestao */
  .modal{position:absolute;inset:0;background:#05101fcc;display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
  .modal.open{display:flex}
  .modalbox{background:linear-gradient(180deg,#11264d,#0c1d3c);border:1px solid #2c5198;border-radius:14px;width:min(760px,96vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px #00081e}
  .modalhd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #21407a}
  .modalhd h2{margin:0;font-size:18px}
  .modalhd .close{background:#10294f;border:1px solid #2c5198;color:var(--ink);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
  .modalbody{padding:16px 18px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:16px}
  .gsec h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--line)}
  .glist{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;max-height:300px;overflow:auto}
  .grow{display:flex;gap:6px;align-items:center}
  .ginput{flex:1;min-width:0;background:#0a1c3a;border:1px solid #2c5198;color:var(--ink);border-radius:6px;padding:6px 8px;font-size:13px}
  .gcolor{width:30px;height:30px;padding:0;border:1px solid #2c5198;border-radius:6px;background:#0a1c3a;cursor:pointer;flex:none}
  .gdel{background:#2a1018;border:1px solid #7a2a3a;color:#ffb9c8;border-radius:6px;cursor:pointer;padding:5px 8px;flex:none}
  .gdel:hover{background:#3a1622}
  .gadd{display:flex;gap:6px}
  .gadd input{flex:1;min-width:0;background:#0a1c3a;border:1px solid #2c5198;color:var(--ink);border-radius:6px;padding:6px 8px;font-size:13px}
  .gadd button{background:#13402a;border:1px solid var(--t-mecanica);color:#bfffe2;border-radius:6px;cursor:pointer;padding:6px 10px;font-size:13px;white-space:nowrap}
  .gvazio{color:var(--ink-soft);font-size:12px;font-style:italic}
  .modalft{padding:10px 18px;border-top:1px solid #21407a;color:var(--ink-soft);font-size:12px}
  @media(max-width:680px){.modalbody{grid-template-columns:1fr}}
  .card .livrotag{font-size:11px;color:#ffd0a3;margin:2px 0 0;font-weight:600}
  .card .grouptag{display:inline-block;font-size:11px;color:#fff;border-radius:6px;padding:1px 7px;margin:3px 4px 0 0;font-weight:600;text-shadow:0 1px 1px #0006}
  .t.livro{background:#3a2410;border-color:#ffb05c;color:#ffd6ad}
  #mundo{height:100%;overflow:auto;padding:18px;display:none}
  .msec{margin-bottom:24px}
  .msech{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .msecn{font-size:12px;background:#0d2348;border:1px solid #2b5095;color:var(--ink-soft);padding:1px 8px;border-radius:10px}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .fatos{margin:4px 0 0;padding-left:18px;font-size:13px;line-height:1.55}
  .gdos{background:#0d2c3f;border:1px solid var(--t-sala);color:#bfe8ff;border-radius:6px;cursor:pointer;padding:5px 8px;flex:none}
  .gdos:hover{filter:brightness(1.2)}
  .maptoggles{position:absolute;left:16px;top:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:62%}
  .mtog{display:flex;align-items:center;gap:6px;font-size:12px;background:#0c1f40d0;border:1px solid #2b5095;color:var(--ink-soft);padding:5px 10px;border-radius:16px;cursor:pointer;user-select:none;opacity:.45;text-decoration:line-through}
  .mtog.on{opacity:1;text-decoration:none;color:var(--ink)}
  .mtog .dot{width:9px;height:9px;border-radius:50%}
  .imgprev{max-width:100%;max-height:170px;border-radius:8px;border:1px solid #2c5198;margin-top:8px;display:block}
  .attachbtn{margin-top:4px}
  /* ---- topo reorganizado (Fase 1 UX) ---- */
  header{padding:10px 16px 12px;border-bottom:1px solid #21407a;background:linear-gradient(180deg,#0d214480,#0c1a3300);backdrop-filter:blur(3px)}
  .appbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:8px}
  .brand h1{font-size:17px;margin:0;letter-spacing:.4px;font-weight:600}
  .brand .sub{color:var(--ink-soft);font-size:12px}
  .appbar .viewtoggle{margin-left:auto}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .filterbar{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .filterbar .search{flex:1;min-width:200px;position:relative}
  .filterbar .search input{padding-right:22px}
  .searchx{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:0}
  .searchx:hover{color:var(--ink)}
  .contador{color:var(--ink-soft);font-size:12px;white-space:nowrap}
  .topbtn.hasfilters{border-color:var(--line);color:#fff;background:#16356b}
  .filtros-pills{display:none;gap:8px;flex-wrap:wrap;margin-top:8px}
  .fpill{background:#102a55;border:1px solid #2c5198;color:var(--ink);font-size:12px;padding:4px 10px;border-radius:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .fpill b{opacity:.65;font-weight:400}
  .fpill:hover{border-color:var(--line)}
  .fpill.clr{background:transparent;color:var(--ink-soft);border-style:dashed}
  .filtros-panel{display:none;margin-top:10px;padding:12px 14px;background:#0c1f40;border:1px solid #284b8c;border-radius:10px;gap:16px;flex-wrap:wrap;align-items:flex-end}
  .filtros-panel.open{display:flex}
  .fgrp{display:flex;flex-direction:column;gap:6px}
  .fgrp label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--line)}
  .badge-inc{display:inline-block;font-size:10px;color:#ffd27a;background:#3a2a08;border:1px solid #7a5a16;border-radius:8px;padding:1px 7px;margin:2px 0}
  .topbtn.on{background:#7a5a16;border-color:#caa53a;color:#fff}
  .ordlbl{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .ordsel{background:#0c1f40;color:var(--ink);border:1px solid #284b8c;border-radius:8px;padding:6px 8px;font-size:12px;cursor:pointer}
  /* ---- polimento visual (Fase 3) ---- */
  *:focus-visible{outline:2px solid var(--line);outline-offset:2px}
  html{scrollbar-width:thin;scrollbar-color:#27508f transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#27508f;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#3a6bc0;background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}
  .topbtn,select,.chip,.fpill,.mtog,.dbtn,.viewtoggle button,.mcard{transition:background .15s,border-color .15s,color .15s,transform .12s,box-shadow .15s}
  .topbtn:hover{border-color:var(--line)}
  .topbtn:active,.dbtn:active{transform:translateY(1px)}
  select:hover,select:focus{border-color:var(--line)}
  @keyframes savepulse{0%,100%{box-shadow:0 0 0 0 rgba(94,255,192,0)}50%{box-shadow:0 0 0 4px rgba(94,255,192,.18)}}
  .topbtn.save.dirty{animation:savepulse 1.8s ease-in-out infinite}
  .empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink-soft);text-align:center;padding:64px 20px;font-size:14px;line-height:1.6}
  .empty .emoji{font-size:42px;opacity:.85;filter:grayscale(.2)}
  .empty button{margin-top:6px}
  .gvazio{font-style:italic}
  .chip:hover{transform:translateY(-1px)}
  .mtog:hover{border-color:var(--line)}
  /* ---- selecao multipla (exclusao em lote) ---- */
  #grade.selmode .card{cursor:pointer}
  .selcheck{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:2px solid #2c5198;background:#0c1f40cc;display:none;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#06122a;z-index:3}
  #grade.selmode .selcheck{display:flex}
  .card.selected .selcheck{background:var(--t-mecanica);border-color:var(--t-mecanica)}
  .card.selected{box-shadow:0 0 0 2px var(--t-mecanica) inset}
  .selbar{display:none;align-items:center;gap:10px;margin-top:10px;padding:8px 12px;background:#0f2f22;border:1px solid var(--t-mecanica);border-radius:10px;flex-wrap:wrap}
  .selbar.on{display:flex}
  .selbar .cnt{font-weight:600;color:#bfffe2}
  .selbar .grow{flex:1;min-width:10px}
  .seldel{background:#2a1018;border:1px solid #7a2a3a;color:#ffb9c8;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
  .seldel:hover{background:#3a1622}
  .savehelp{padding:16px 18px;font-size:14px;line-height:1.55;display:flex;flex-direction:column;gap:10px}
  .savehelp p{margin:0}
  .pathbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#0a1c3a;border:1px solid #2c5198;border-radius:8px;padding:8px 10px}
  .pathbox code{flex:1;min-width:0;color:#bfe8ff;font-size:13px;word-break:break-all}
  .savehelp .dica{color:var(--ink-soft);font-size:12px}
  .reconnect{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:10px;flex-wrap:wrap;background:#16356b;border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:10px;box-shadow:0 8px 26px #00081e;font-size:13px;max-width:92vw}
  /* ---- Diretorio (estilo do jogo) ---- */
  #diretorio{height:100%;overflow:hidden;display:none}
  .dirwrap{display:flex;height:100%}
  .dirmenu{flex:0 0 210px;background:linear-gradient(180deg,#16335f,#0c1f40);border-right:2px solid #caa53a;padding:14px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
  .dirtitle{color:#bcd2ff;letter-spacing:3px;font-size:11px;text-align:center;margin-bottom:12px;line-height:1.5}
  .dirtitle b{font-size:18px;letter-spacing:4px;color:#fff}
  .dirbtn{background:#1d3e72;border:1px solid #2c5198;color:#dfe9ff;padding:9px 10px;border-radius:4px;cursor:pointer;font-size:12px;letter-spacing:1px;text-align:left;transition:.12s}
  .dirbtn:hover{background:#27508f}

<script>
function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
const COR_SALA="#5ec8ff", COR_PESSOA="#ff7e9a", COR_LIVRO="#ffb05c", COR_MANUAL="#a98bff";
const mapLayers={pessoa:true,sala:true,colecao:true,grupo:true,manual:true};
const SALAS_OFICIAIS = {
  "The Foundation": {tipo:"Blueprint", raridade:"Rare", efeito:"Does not reset each day.", desc:"The cornerstone of the house, unvarying and unchanging, The Foundation is one of the only constants in the estate on which you can truly rely. This natural cavity was hollowed directly out of the mountain itself, with its stone and earth walls displaying an underlying coarseness that the rest of the mansion conceals."}
};
const TIPOS_PADRAO=[
  {id:"sala",nome:"Sala",cor:"#5ec8ff"},
  {id:"pista",nome:"Pista",cor:"#ffd35e"},
  {id:"carta",nome:"Carta/Doc",cor:"#a98bff"},
  {id:"pessoa",nome:"Pessoa",cor:"#ff7e9a"},
  {id:"mecanica",nome:"Mecânica",cor:"#5effc0"}
];
var SCHEMA_VERSION=6, DADOS_BROKEN=false;
function _dadosValido(d){return !!(d&&typeof d==="object"&&Array.isArray(d.fichas)&&Array.isArray(d.salas)&&Array.isArray(d.personagens));}
if(typeof DADOS==="undefined"||!DADOS||typeof DADOS!=="object"||!Array.isArray(DADOS.fichas)){ DADOS=window.DADOS={version:SCHEMA_VERSION,salas:[],personagens:[],colecoes:[],grupos:[],teorias:[],quadros:[],fichas:[],tipos:[]}; DADOS_BROKEN=true; }
DADOS.fichas=DADOS.fichas||[];
DADOS.teorias=DADOS.teorias||[];
if(!Array.isArray(DADOS.quadros)){
  DADOS.quadros=[{nome:"Quadro 1",cam:{x:40,y:40,s:1},nodes:[],setas:[]}];
  (DADOS.teorias||[]).forEach(function(t,i){var tx=String(t.texto||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();DADOS.quadros[0].nodes.push({id:"n0_"+i,tipo:"texto",texto:((t.titulo?t.titulo+"\n":"")+tx),x:40+i*40,y:40+i*40,w:250});});
}
if(!Array.isArray(DADOS.tipos)||!DADOS.tipos.length) DADOS.tipos=TIPOS_PADRAO.map(t=>({...t}));
(function(){const ids=new Set(DADOS.tipos.map(t=>t.id));
  DADOS.fichas.forEach(f=>{if(f.tipo&&!ids.has(f.tipo)){ids.add(f.tipo);DADOS.tipos.push({id:f.tipo,nome:f.tipo,cor:"#88a"});}});})();
function _normEnt(arr,nomes){
  let list=Array.isArray(arr)?arr.map(x=>typeof x==="string"?{nome:x}:x):[];
  list=list.map(e=>Object.assign({nome:"",imagem:"",descricao:"",fatos:[],notas:""},e));
  const set=new Set(list.map(e=>e.nome));
  nomes.forEach(n=>{if(n&&!set.has(n)){set.add(n);list.push({nome:n,imagem:"",descricao:"",fatos:[],notas:""});}});
  return list;
}
DADOS.salas=_normEnt(DADOS.salas,DADOS.fichas.map(f=>f.sala).filter(Boolean));
(function(){DADOS.salas.forEach(s=>{
  const cat=(s.categorias&&s.categorias[0])||"";
  if(!s.diretorio)s.diretorio = cat==="Found Floorplan"?"Found Floorplans":cat==="Outer Room"?"Outer Rooms":cat==="Studio Addition"?"Found Floorplans":"";
  const o=SALAS_OFICIAIS[s.nome];
  if(o){if(o.tipo)s.tipo=o.tipo;if(o.raridade)s.raridade=o.raridade;if(o.efeito)s.efeito=o.efeito;if(o.desc)s.descricao=o.desc;}
});})();
DADOS.personagens=_normEnt(DADOS.personagens,DADOS.fichas.flatMap(f=>f.personagens||[]).filter(Boolean));
DADOS.colecoes=_normEnt(DADOS.colecoes,DADOS.fichas.flatMap(f=>f.colecoes||[]).filter(Boolean));
function nomesDe(arr){return arr.map(e=>e.nome);}
function acharEnt(arr,nome){return arr.find(e=>e.nome===nome);}
function entListaDe(kind){return kind==="sala"?DADOS.salas:kind==="grupo"?DADOS.grupos:kind==="colecao"?DADOS.colecoes:DADOS.personagens;}
function descobrirSala(nome){const alvo=(nome||"").trim();if(!alvo)return "";let s=DADOS.salas.find(x=>x.nome.toLowerCase()===alvo.toLowerCase());if(s){s.descoberta=true;return s.nome;}DADOS.salas.push({nome:alvo,imagem:"",descricao:"",categorias:[],fatos:[],notas:"",descoberta:true});return alvo;}
function confirmarDescobrir(nome){const s=acharEnt(DADOS.salas,nome);if(!s)return;let m=document.getElementById("descModal");if(!m){m=document.createElement("div");m.id="descModal";m.className="modal";document.body.appendChild(m);}
  m.innerHTML=`<div class="modalbox" style="max-width:460px"><div class="modalhd"><h2>Descobrir sala?</h2><button class="close" onclick="fecharDesc()">✕</button></div>

let nodes=[],links=[],sim=null;

    nmap[id]=n;nodes.push(n);return n}

    node(f.id,f.titulo,"ficha",corGrupo(f),9);

      links.push({s:f.id,t:"pes::"+p,kind:"pessoa"})});

function step(W,H){

  links.forEach(l=>{const a=nmap(l.s),b=nmap(l.t);if(!a||!b)return;
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-springLen)*0.02;

function drawMini(){

    if(_drag){const n=nmap(_drag.id);if(!n)return;const w=s2w(pp.x,pp.y);n.x=w.x;n.y=w.y;_drag.moved=true;draw(svg);}
    else if(_pan){cam.x=_pan.cx+(pp.x-_pan.mx);cam.y=_pan.cy+(pp.y-_pan.my);_pan.moved=true;draw(svg);}
  });
  window.addEventListener("mouseup",()=>{
    if((_drag&&_drag.moved)||(_pan&&_pan.moved))_suppress=true;
    _drag=null;if(_pan){_pan=null;svg.style.cursor="grab";}
  });
  svg.addEventListener("click",e=>{
    if(_suppress){_suppress=false;return;}
    const d=nodeFrom(e);if(!d)return;

    else if(d.kind==="colecao")abrirEntidade("colecao",d.id.slice(5));
  });
  svg.addEventListener("wheel",e=>{
    e.preventDefault();const pp=rel(e),w=s2w(pp.x,pp.y);
    const f=e.deltaY<0?1.12:1/1.12;
    cam.s=Math.max(0.12,Math.min(4,cam.s*f));
    cam.x=pp.x-w.x*cam.s;cam.y=pp.y-w.y*cam.s;draw(svg);
  },{passive:false});
  const mini=document.getElementById("minisvg");
  if(mini)mini.addEventListener("click",e=>{
    if(!_miniT)return;const r=mini.getBoundingClientRect();
    const wx=(e.clientX-r.left-_miniT.ox)/_miniT.s, wy=(e.clientY-r.top-_miniT.oy)/_miniT.s;
    cam.x=_viewW/2-wx*cam.s;cam.y=_viewH/2-wy*cam.s;draw(svg);
  });
}

let _lb={s:1,x:0,y:0,drag:null};
function aplicaLB(){const m=document.getElementById("lightbox");if(!m)return;const img=m.querySelector(".lbimg");if(img)img.style.transform=`translate(${_lb.x}px,${_lb.y}px) scale(${_lb.s})`;}
function fecharLightbox(){const m=document.getElementById("lightbox");if(m)m.classList.remove("open");}
function abrirLightbox(src){
  if(!src)return;
  let m=document.getElementById("lightbox");
  if(!m){
    m=document.createElement("div");m.id="lightbox";m.className="lightbox";
    m.innerHTML='<button class="lbclose" title="Fechar (Esc)">✕</button><div class="lbhint">Roda do mouse: zoom · arraste: mover · duplo-clique: reset</div><img class="lbimg" alt="">';
    document.body.appendChild(m);
    const img=m.querySelector(".lbimg");
    m.addEventListener("mousedown",e=>{if(e.target===m)fecharLightbox();});
    m.querySelector(".lbclose").onclick=fecharLightbox;
    m.addEventListener("wheel",function(e){e.preventDefault();
      const f=e.deltaY<0?1.15:1/1.15;
      const ns=Math.max(0.15,Math.min(10,_lb.s*f));
      const r=ns/_lb.s;
      const rect=img.getBoundingClientRect();
      const dentro=e.clientX>=rect.left&&e.clientX<=rect.right&&e.clientY>=rect.top&&e.clientY<=rect.bottom;
      if(dentro){const ox=window.innerWidth/2,oy=window.innerHeight/2,ux=e.clientX-ox,uy=e.clientY-oy;_lb.x=ux-(ux-_lb.x)*r;_lb.y=uy-(uy-_lb.y)*r;}
      _lb.s=ns;aplicaLB();
    },{passive:false});
    img.addEventListener("mousedown",e=>{e.preventDefault();e.stopPropagation();_lb.drag={x:e.clientX,y:e.clientY,ox:_lb.x,oy:_lb.y};});
    window.addEventListener("mousemove",e=>{if(_lb.drag){_lb.x=_lb.drag.ox+(e.clientX-_lb.drag.x);_lb.y=_lb.drag.oy+(e.clientY-_lb.drag.y);aplicaLB();}});
    window.addEventListener("mouseup",()=>{_lb.drag=null;});
    img.addEventListener("dblclick",()=>{_lb.s=1;_lb.x=0;_lb.y=0;aplicaLB();});
    window.addEventListener("keydown",e=>{if(e.key==="Escape"&&m.classList.contains("open"))fecharLightbox();});
  }
  _lb={s:1,x:0,y:0,drag:null};
  m.querySelector(".lbimg").src=src;
  aplicaLB();
  m.classList.add("open");
}

function escolherImagem(inputId,previewId){
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=async ()=>{const file=inp.files&&inp.files[0];if(!file)return;
    let val,prev;
    const path=await salvarImagemArquivo(file,"ficha");
    if(path){val=path;prev=URL.createObjectURL(file);}
    else{const url=await redimImagem(file);val=url;prev=url;}
    const t=document.getElementById(inputId);if(t)t.value=val;
    const pv=document.getElementById(previewId);if(pv){pv.src=prev;pv.style.display="block";}
  };
  inp.click();
}
function redimImagem(file){return new Promise((res)=>{const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const max=1100;let w=img.width,hh=img.height;if(w>max||hh>max){const s=max/Math.max(w,hh);w=Math.round(w*s);hh=Math.round(hh*s);}const cv=document.createElement("canvas");cv.width=w;cv.height=hh;cv.getContext("2d").drawImage(img,0,0,w,hh);let url;try{url=cv.toDataURL("image/jpeg",0.82);}catch(e){url=rd.result;}res(url);};img.onerror=()=>res(rd.result);img.src=rd.result;};rd.readAsDataURL(file);});}
let dirHandle=null;
async function ensureImagensDir(){
  if(!window.showDirectoryPicker)return null;
  if(!dirHandle)dirHandle=await idbGet("dirHandle");
  if(dirHandle){let perm="prompt";try{perm=await dirHandle.queryPermission({mode:"readwrite"});}catch(e){}
    if(perm!=="granted"){try{perm=await dirHandle.requestPermission({mode:"readwrite"});}catch(e){perm="denied";}}
    if(perm!=="granted")dirHandle=null;}
  if(!dirHandle){try{dirHandle=await window.showDirectoryPicker({mode:"readwrite"});await idbSet("dirHandle",dirHandle);}catch(e){return null;}}
  try{return await dirHandle.getDirectoryHandle("imagens",{create:true});}catch(e){return null;}
}
function _extDe(t){return t==="image/png"?"png":t==="image/webp"?"webp":t==="image/gif"?"gif":"jpg";}
async function salvarImagemArquivo(blob,base){try{const dir=await ensureImagensDir();if(!dir)return null;
  const name=(base||"img")+"-"+Date.now()+"."+_extDe(blob.type);
  const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();
  return "imagens/"+name;}catch(e){return null;}}
async function conectarPasta(){const dir=await ensureImagensDir();toast(dir?"Pasta conectada ✓ — colagens viram arquivos em imagens/":"Nao foi possivel conectar a pasta.",3800);}
async function migrarImagens(){
  const dir=await ensureImagensDir();if(!dir){alert("Preciso de acesso a pasta (Chrome/Edge). Clique em 'Conectar pasta' primeiro.");return;}
  let n=0;const alvos=[...fichas,...DADOS.salas,...DADOS.personagens,...DADOS.colecoes];
  for(const o of alvos){if(o.imagem&&o.imagem.indexOf("data:")===0){try{
    const blob=await (await fetch(o.imagem)).blob();
    const base=o.id?("ficha-"+o.id):("img-"+String(o.nome||"x").toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"").slice(0,16));
    const name=base+"-"+Date.now()+"-"+Math.floor(Math.random()*1000)+"."+_extDe(blob.type);
    const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();
    o.imagem="imagens/"+name;n++;
  }catch(e){}}}
  marcarAlterado();render();toast(n+" imagem(ns) convertida(s) em arquivo ✓ — agora clique em 💾 Salvar.",6000);
}

function removerPaginaEdit(i){if(_editPaginas.length<=1)return;_editPaginas.splice(i,1);if(_editPgIdx>=_editPaginas.length)_editPgIdx=_editPaginas.length-1;renderPagEdit();}
function salvarFichaEdit(id){
  const f=fichas.find(x=>x.id===id);if(!f)return;
  coletarPagEdit();
  const g=k=>{const el=document.getElementById('ed-'+k);return el?el.value:'';};
  f.titulo=g('titulo').trim()||'(sem título)';
  f.sala=g('sala').trim();
  f.personagens=g('personagens').split(',').map(s=>s.trim()).filter(Boolean);
  f.grupos=g('grupos').split(',').map(s=>s.trim()).filter(Boolean);
  f.grupos.forEach(gn=>{if(!acharEnt(DADOS.grupos,gn))DADOS.grupos.push({nome:gn,cor:_corHash(gn),imagem:'',descricao:'',fatos:[],notas:''});});
  f.notas=g('notas');
  f.status=g('status');
  f.paginas=_editPaginas.map(p=>({imagem:p.imagem||"",original:p.original||"",traducao:p.traducao||"",explica:p.explica||"",rotulo:p.rotulo||""}));
  delete f.imagem;delete f.original;delete f.traducao;delete f.explica;delete f.simbolos;delete f.ordem;
  if(f.sala)f.sala=descobrirSala(f.sala);
  f.personagens.forEach(pp=>{if(!acharEnt(DADOS.personagens,pp))DADOS.personagens.push({nome:pp,imagem:"",descricao:"",fatos:[],notas:""});});
  marcarAlterado();rebuildFilters();render();abrir(id);
}
function excluirFicha(id){
  const f=fichas.find(x=>x.id===id);if(!f)return;
  if(!confirm('Excluir a ficha "'+f.titulo+'"?\n\nA exclusao vale depois que voce salvar o dados.js.'))return;
  fichas.splice(fichas.indexOf(f),1);
  marcarAlterado();fechar();rebuildFilters();render();
}
function novaFicha(){
  let n=1;const ids=fichas.map(f=>f.id);while(ids.includes('f'+n))n++;
  const nf={id:'f'+n,titulo:'Nova ficha',imagem:'',original:'',traducao:'',explica:'',sala:'',colecoes:[],ordem:undefined,personagens:[],conexoes:[],notas:'',pendente:true};
  fichas.push(nf);marcarAlterado();render();editarFicha(nf.id);
}

function serializeDados(){
  return "/* Blue Prince - dados.js (gerado pelo painel em "+new Date().toLocaleString()+") */\n\nconst DADOS = "+JSON.stringify(DADOS,null,2)+";\n";
}
let _lastBkp=0;
async function gravarBackup(force){
  try{
    if(!force && Date.now()-_lastBkp < 90000) return;
    let dh=dirHandle; if(!dh){dh=await idbGet("dirHandle"); if(dh)dirHandle=dh;}
    if(!dh) return;
    let perm="prompt"; try{perm=await dh.queryPermission({mode:"readwrite"});}catch(e){}
    if(perm!=="granted") return;
    const bk=await dh.getDirectoryHandle("backups",{create:true});
    const d=new Date();const z=n=>String(n).padStart(2,"0");
    const name="dados-"+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+"-"+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds())+".js";
    const fh=await bk.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(serializeDados());await w.close();
    _lastBkp=Date.now();
    const nomes=[];for await(const [nm,hh] of bk.entries()){if(nm.indexOf("dados-")===0&&nm.endsWith(".js"))nomes.push(nm);}
    nomes.sort();
    while(nomes.length>15){const old=nomes.shift();try{await bk.removeEntry(old);}catch(e){}}
  }catch(e){}
}
let fileHandle=null;
async function salvarTudo(){
  if(DADOS_BROKEN && !confirm("Os dados estao em modo de recuperacao (possivelmente vazios). Salvar agora grava por cima do arquivo. Recomendo restaurar um backup antes. Continuar mesmo assim?"))return;
  const txt=serializeDados();
  if(fileHandle && await discoMudou() && !confirm("O arquivo dados.js mudou fora do painel. Sobrescrever com a sua versao? (Cancelar = recarregar)")){location.reload();return;}
  if(window.showSaveFilePicker){
    try{
      if(!fileHandle){fileHandle=await window.showSaveFilePicker({suggestedName:'dados.js',types:[{description:'JavaScript',accept:{'text/javascript':['.js']}}]});idbSet('fileHandle',fileHandle);}
      const w=await fileHandle.createWritable();await w.write(txt);await w.close();
      marcarSalvo();toast('Salvo direto no arquivo ✓  (recarregue o painel para confirmar)');gravarBackup(true);snapshotDB(true);_diskMtime=await lerMtime();return;
    }catch(e){if(e&&e.name==='AbortError')return;}
  }
  const b=new Blob([txt],{type:'text/javascript'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='dados.js';document.body.appendChild(a);a.click();a.remove();
  marcarSalvo();ajudaSalvar();
}

function toast(msg,ms){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms||5500);}

let autoSave=false, autoTimer=null;
function setAuto(v){autoSave=v;const b=document.getElementById('btnAuto');if(b){b.classList.toggle('on',autoSave);b.textContent=autoSave?'⟳ Auto: ON':'⟳ Auto';}idbSet('autoOn',v);}
/* ---- persistencia do arquivo (IndexedDB) p/ religar apos recarregar ---- */
function _idb(){return new Promise((res,rej)=>{const r=indexedDB.open('bpPanel',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSet(k,v){try{const db=await _idb();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){}}
async function idbGet(k){try{const db=await _idb();return await new Promise((res)=>{const t=db.transaction('kv','readonly');const q=t.objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined);});}catch(e){return undefined;}}
async function trocarArquivo(){
  if(!window.showSaveFilePicker){alert('Trocar arquivo precisa do Chrome ou Edge.');return;}
  try{
    fileHandle=await window.showSaveFilePicker({suggestedName:'dados.js',types:[{description:'JavaScript',accept:{'text/javascript':['.js']}}]});
    await idbSet('fileHandle',fileHandle);
    const w=await fileHandle.createWritable();await w.write(serializeDados());await w.close();
    setAuto(true);marcarSalvo();toast('Arquivo trocado e auto-salvar ligado \u2713',2600);
  }catch(e){if(e&&e.name==='AbortError')return;}
}

let _lastSnap=0, _diskMtime=0;
async function snapshotDB(force){
  try{ if(DADOS_BROKEN) return;
    if(!force && Date.now()-_lastSnap < 60000) return;
    let snaps=await idbGet("snaps")||[];
    snaps.push({t:Date.now(), n:(DADOS.fichas||[]).length, data:JSON.parse(JSON.stringify(DADOS))});
    while(snaps.length>10) snaps.shift();
    await idbSet("snaps",snaps); _lastSnap=Date.now();
  }catch(e){}
}
async function lerMtime(){ try{ if(fileHandle){const f=await fileHandle.getFile(); return f.lastModified||0;} }catch(e){} return 0; }
async function discoMudou(){ if(!fileHandle) return false; const m=await lerMtime(); return !!(_diskMtime && m && m > _diskMtime+1500); }
function bannerDisco(){ let b=document.getElementById("diskBanner");
  if(!b){b=document.createElement("div");b.id="diskBanner";b.className="diskbanner";document.body.appendChild(b);}
  b.innerHTML='⚠ O arquivo dados.js mudou fora do painel. <button class="topbtn" onclick="location.reload()">Recarregar</button> <button class="topbtn" onclick="forcarSalvar()">Manter o meu (sobrescrever)</button> <button class="topbtn" onclick="this.parentNode.style.display=\'none\'">Ignorar</button>';
  b.style.display='flex'; }
async function forcarSalvar(){ const b=document.getElementById("diskBanner"); if(b)b.style.display='none';
  try{const w=await fileHandle.createWritable();await w.write(serializeDados());await w.close();_diskMtime=await lerMtime();gravarBackup(true);snapshotDB(true);marcarSalvo();toast('Sobrescrito com a sua versao ✓');}catch(e){toast('Falha ao salvar.',3000);} }
function _parseDadosTxt(txt){ const a=txt.indexOf("{"); const b=txt.lastIndexOf("}"); if(a<0||b<0) throw new Error("formato"); return JSON.parse(txt.slice(a,b+1)); }
function _tsNome(nm){ const m=nm.match(/dados-(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)(\d\d)/); if(!m)return 0; return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime(); }
let _fontesCache=[];
async function listarFontes(comDisco){
  const cands=[];
  try{ const snaps=await idbGet("snaps")||[]; snaps.slice().reverse().forEach(s=>cands.push({fonte:"Snapshot interno (navegador)",t:s.t,n:s.n,data:s.data})); }catch(e){}
  if(comDisco){
    try{ let dh=dirHandle||await idbGet("dirHandle");
      if(dh){ let perm="prompt"; try{perm=await dh.queryPermission({mode:"readwrite"});}catch(e){} if(perm!=="granted"){try{perm=await dh.requestPermission({mode:"readwrite"});}catch(e){}}
        if(perm==="granted"){ dirHandle=dh; const bk=await dh.getDirectoryHandle("backups",{create:true});
          for await(const [nm,hh] of bk.entries()){ if(nm.indexOf("dados-")===0&&nm.endsWith(".js")) cands.push({fonte:"backups/"+nm,t:_tsNome(nm),n:null,handle:hh}); } } }
    }catch(e){}
  }
  return cands.sort((a,b)=>b.t-a.t);
}
async function _obterData(c){ if(c.data) return c.data; if(c.handle){const f=await c.handle.getFile(); return _parseDadosTxt(await f.text());} throw new Error("sem fonte"); }
async function restaurarFonte(idx){
  try{ const c=_fontesCache[idx]; if(!c)return; const d=await _obterData(c);
    if(!_dadosValido(d)){ alert("Esse backup parece invalido."); return; }
    if(!confirm("Restaurar este backup? O dados.js sera sobrescrito e o painel vai recarregar."))return;
    let fh=fileHandle||await idbGet("fileHandle");
    if(!fh){ if(!window.showSaveFilePicker){alert("Use Chrome/Edge para gravar.");return;} fh=await window.showSaveFilePicker({suggestedName:'dados.js',types:[{description:'JavaScript',accept:{'text/javascript':['.js']}}]}); await idbSet("fileHandle",fh); }
    else { let perm=fh.queryPermission?await fh.queryPermission({mode:"readwrite"}):"granted"; if(perm!=="granted"){perm=await fh.requestPermission({mode:"readwrite"}); if(perm!=="granted"){alert("Permissao negada.");return;}} }
    const txt="/* Blue Prince - dados.js (restaurado em "+new Date().toLocaleString()+") */\n\nconst DADOS = "+JSON.stringify(d,null,2)+";\n";
    const w=await fh.createWritable();await w.write(txt);await w.close();
    toast("Restaurado ✓ recarregando...",1500); setTimeout(()=>location.reload(),700);
  }catch(e){ if(e&&e.name==='AbortError')return; alert("Falha ao restaurar: "+(e&&e.message||e)); }
}
function _linhasFontes(l){ return l.length? l.map((c,i)=>`<div class="linkrow"><span>${esc(c.fonte)} — ${new Date(c.t).toLocaleString()}${c.n!=null?(" · "+c.n+" fichas"):""}</span> <button class="dbtn save" onclick="restaurarFonte(${i})">Restaurar</button></div>`).join("") : "<div class='gvazio'>Nenhum backup encontrado.</div>"; }
async function abrirBackups(comDisco){
  let m=document.getElementById("bkModal"); if(!m){m=document.createElement("div");m.id="bkModal";m.className="modal";document.body.appendChild(m);}
  m.innerHTML='<div class="modalbox" style="max-width:600px"><div class="modalhd"><h2>🛠 Backups / Restaurar</h2><button class="close" onclick="document.getElementById(\'bkModal\').classList.remove(\'open\')">✕</button></div><div class="savehelp"><p class="dica">Suas fichas tem 3 copias: o arquivo dados.js, os backups da pasta e snapshots no navegador. Restaurar grava o escolhido no dados.js e recarrega.</p><div class="editbtns" style="margin:0 0 8px"><button class="dbtn" onclick="abrirBackups(true)">🔄 Incluir backups da pasta</button></div><div id="bkLista" class="linklista">Carregando...</div></div></div>';
  m.classList.add("open");
  _fontesCache=await listarFontes(!!comDisco);
  const box=document.getElementById("bkLista"); if(box)box.innerHTML=_linhasFontes(_fontesCache);
}
function abrirRecuperacao(){
  let m=document.getElementById("recModal"); if(!m){m=document.createElement("div");m.id="recModal";m.className="modal";document.body.appendChild(m);}
  m.innerHTML='<div class="modalbox" style="max-width:600px"><div class="modalhd"><h2>⚠ Recuperar dados</h2></div><div class="savehelp"><p class="dica">O <b>dados.js</b> nao pode ser lido (vazio, corrompido ou truncado). O auto-salvar foi <b>desligado</b> para nao sobrescrever nada. Escolha um backup para restaurar:</p><div class="editbtns" style="margin:0 0 8px"><button class="dbtn" onclick="abrirBackups(true)">🔄 Procurar na pasta backups/</button><button class="dbtn" onclick="importarDados()">⬆ Importar arquivo</button></div><div id="recLista" class="linklista">Procurando snapshots...</div></div></div>';
  m.classList.add("open");
  listarFontes(false).then(l=>{_fontesCache=l;const box=document.getElementById("recLista"); if(box)box.innerHTML=l.length?_linhasFontes(l):"<div class='gvazio'>Nenhum snapshot interno. Clique em 'Procurar na pasta backups/' ou 'Importar arquivo'.</div>";});
}
async function reconectarAoCarregar(){
  try{
    if(DADOS_BROKEN)return;
    if(!('indexedDB' in window))return;
    const autoOn=await idbGet('autoOn'); if(autoOn===false)return;
    const hnd=await idbGet('fileHandle'); if(!hnd)return;
    const perm=hnd.queryPermission?await hnd.queryPermission({mode:'readwrite'}):'prompt';
    if(perm==='granted'){fileHandle=hnd;setAuto(true);_diskMtime=await lerMtime();}
    else mostrarReconectar(hnd);
  }catch(e){}
}
function agendarAuto(){if(!autoSave||!fileHandle)return;clearTimeout(autoTimer);autoTimer=setTimeout(salvarAuto,700);}
async function salvarAuto(){if(!autoSave||!fileHandle||DADOS_BROKEN)return;try{if(await discoMudou()){setAuto(false);bannerDisco();return;}const w=await fileHandle.createWritable();await w.write(serializeDados());await w.close();_diskMtime=await lerMtime();gravarBackup(false);snapshotDB(false);marcarSalvo();toast('\u2713 salvo automaticamente',1400);}catch(e){setAuto(false);toast('Auto-salvar pausado (permissao perdida). Clique em Salvar.',5000);}}
function toggleAuto(){
  if(autoSave){setAuto(false);clearTimeout(autoTimer);toast('Auto-salvar desligado',1800);return;}
  if(!window.showSaveFilePicker){alert('Auto-salvar precisa do Chrome ou Edge (que gravam direto no arquivo). Em outros navegadores o Salvar baixa o arquivo, entao nao da pra automatizar.');return;}
  setAuto(true);
  if(!fileHandle){ salvarTudo().then(()=>{ if(!fileHandle){setAuto(false);} else { toast('Auto-salvar ligado \u2713',2000); if(dirty)agendarAuto(); } }); }
  else { toast('Auto-salvar ligado \u2713',2000); if(dirty)agendarAuto(); }
}

/* ---- gestao de salas / personagens / tipos ---- */
function abrirGestao(){document.getElementById("modalGestao").classList.add("open");renderGestao();}
function fecharGestao(){document.getElementById("modalGestao").classList.remove("open");}
function renderGestao(){
  buildLista("g-salas",[...DADOS.salas].sort((a,b)=>a.nome<b.nome?-1:1),"sala");
  buildLista("g-pessoas",[...DADOS.personagens].sort((a,b)=>a.nome<b.nome?-1:1),"pessoa");
  buildLista("g-grupos",[...DADOS.grupos].sort((a,b)=>a.nome<b.nome?-1:1),"grupo");
}
function buildLista(elId,arr,kind){
  const box=document.getElementById(elId);if(!box)return;box.innerHTML="";
  if(!arr.length){box.innerHTML='<div class="gvazio">(vazio)</div>';return;}
  arr.forEach(ent=>{
    const nome=ent.nome;
    const row=document.createElement("div");row.className="grow";
    const inp=document.createElement("input");inp.className="ginput";inp.value=nome;
    inp.onchange=()=>{const nv=inp.value.trim();if(nv&&nv!==nome){renomearEnt(kind,nome,nv);}else if(!nv){inp.value=nome;}};
    const dos=document.createElement("button");dos.className="gdos";dos.textContent="📋";dos.title="Abrir dossiê";
    dos.onclick=()=>{fecharGestao();abrirEntidade(kind,nome);};
    const del=document.createElement("button");del.className="gdel";del.textContent="🗑";
    del.onclick=()=>{if(confirm('Excluir "'+nome+'"? Sera removido das fichas e o dossie apagado.')){excluirEnt(kind,nome);}};
    if(kind==="grupo"){const col=document.createElement("input");col.type="color";col.className="gcolor";col.value=hex6(ent.cor);col.oninput=()=>{ent.cor=col.value;marcarAlterado();render();};row.appendChild(col);}
    row.appendChild(inp);row.appendChild(dos);row.appendChild(del);box.appendChild(row);
  });
}
function hex6(c){c=(c||"").trim();if(/^#[0-9a-f]{6}$/i.test(c))return c;if(/^#[0-9a-f]{3}$/i.test(c))return "#"+c.slice(1).split("").map(x=>x+x).join("");return "#8888aa";}
function addSala(){addEnt("sala","add-sala");}
function addPessoa(){addEnt("pessoa","add-pessoa");}
function addGrupo(){const el=document.getElementById("add-grupo");const nv=((el&&el.value)||"").trim();if(!nv)return;if(acharEnt(DADOS.grupos,nv)){alert("Já existe um grupo com esse nome.");return;}DADOS.grupos.push({nome:nv,cor:_corHash(nv),imagem:"",descricao:"",fatos:[],notas:""});el.value="";marcarAlterado();rebuildFilters();render();renderGestao();}
function addEnt(kind,inputId){const i=document.getElementById(inputId);const v=i.value.trim();if(!v)return;const arr=entListaDe(kind);if(!acharEnt(arr,v))arr.push({nome:v,imagem:"",descricao:"",fatos:[],notas:""});i.value="";marcarAlterado();rebuildFilters();render();renderGestao();}
function renomearEnt(kind,o,nv){const arr=entListaDe(kind);const e=acharEnt(arr,o);if(!e)return;if(nv!==o&&acharEnt(arr,nv)){alert("Ja existe um item com esse nome.");renderGestao();return;}e.nome=nv;fichas.forEach(f=>{if(kind==="sala"&&f.sala===o)f.sala=nv;if(kind==="grupo")f.grupos=(f.grupos||[]).map(x=>x===o?nv:x);if(kind==="colecao")f.colecoes=(f.colecoes||[]).map(x=>x===o?nv:x);if(kind==="pessoa")f.personagens=(f.personagens||[]).map(p=>p===o?nv:p);});marcarAlterado();rebuildFilters();render();renderGestao();}
function excluirEnt(kind,o){const arr=entListaDe(kind);const i=arr.findIndex(e=>e.nome===o);if(i<0)return;arr.splice(i,1);fichas.forEach(f=>{if(kind==="sala"&&f.sala===o)f.sala="";if(kind==="grupo")f.grupos=(f.grupos||[]).filter(x=>x!==o);if(kind==="colecao")f.colecoes=(f.colecoes||[]).filter(x=>x!==o);if(kind==="pessoa")f.personagens=(f.personagens||[]).filter(p=>p!==o);});marcarAlterado();rebuildFilters();render();renderGestao();}

function jsq(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function iconKind(k){return k==="sala"?"🚪":k==="grupo"?"📦":k==="colecao"?"📚":"👤";}
function colEmoji(t){return t==="livro"?"📖":t==="quadros"?"🖼️":t==="cor"?"🎨":"📚";}
function corKind(k){return k==="sala"?COR_SALA:k==="grupo"?COR_LIVRO:k==="colecao"?COR_LIVRO:COR_PESSOA;}
function rotKind(k){return k==="sala"?"Sala":k==="grupo"?"Grupo":k==="colecao"?"Coleção":"Personagem";}
function pistasQueCitam(kind,nome){return fichas.filter(f=>kind==="sala"?f.sala===nome:kind==="grupo"?(f.grupos||[]).includes(nome):kind==="colecao"?(f.colecoes||[]).includes(nome):(f.personagens||[]).includes(nome));}
function _temMencao(txt,nome){
  if(!txt||!nome||nome.length<2)return false;
  const t=String(txt).toLowerCase(), n=nome.toLowerCase();let i=t.indexOf(n);
  while(i>=0){const b=i===0?" ":t[i-1];const a=(i+n.length>=t.length)?" ":t[i+n.length];
    if(!/[\wÀ-ÿ]/.test(b)&&!/[\wÀ-ÿ]/.test(a))return true;i=t.indexOf(n,i+1);}
  return false;
}
function mencionaTexto(f,nome){return [f.titulo,txtAll(f)].some(t=>_temMencao(t,nome));}
function rotDiretas(kind){return kind==="sala"?"Encontradas nesta sala":kind==="grupo"?"Pistas deste grupo":kind==="colecao"?"Pistas desta coleção":"Fichas marcadas com este personagem";}
function tagPistas(arr){return arr.length?`<span class="taglist">${arr.map(f=>`<span class="t conx" onclick="abrir('${f.id}')">🔗 ${esc(f.titulo)}${f.sala&&f.sala!==""?` <small style="opacity:.6">· ${esc(f.sala)}</small>`:""}</span>`).join("")}</span>`:"<span class='gvazio'>(nenhuma)</span>";}
let _entAtual=null;
function abrirEntidade(kind,nome){
  const e=acharEnt(entListaDe(kind),nome);if(!e)return;
  _entAtual={kind,nome};
  const diretas=pistasQueCitam(kind,nome);
  const idsDir=new Set(diretas.map(f=>f.id));
  const mencoes=fichas.filter(f=>!idsDir.has(f.id)&&mencionaTexto(f,nome));
  const d=document.getElementById("drawer");
  d.innerHTML=`
    <div class="dh">
      <button class="close" onclick="fechar()">✕</button>
      <div class="tipo" style="color:${corKind(kind)}">${iconKind(kind)} ${rotKind(kind)} (dossiê)</div>
      <h2>${esc(nome)}</h2>
      <div class="dactions"><button class="dbtn" onclick="editarEntidade()">✏️ Editar dossiê</button><button class="dbtn" onclick="focarEnt('${kind}','${jsq(nome)}')">🎯 Focar no mapa</button>${(kind==="colecao"&&e.ordenada)?`<button class="dbtn" onclick="abrirLeitor('${jsq(nome)}')">📖 Folhear</button>`:""}${kind==="sala"?`<button class="dbtn" onclick="rebloquearSala('${jsq(nome)}')" title="Voltar esta sala para o estado desconhecido">🔒 Re-bloquear</button>`:""}</div>
    </div>
    <div class="db">
      ${e.imagem?`<img src="${esc(e.imagem)}" onerror="this.style.display='none'">`:""}
      ${e.descricao?field("Descrição",esc(e.descricao)):""}
      ${kind==="sala"?(field("Tipo",esc(e.tipo||((e.categorias||[]).join(", "))||"—"))+(e.raridade?field("Raridade",esc(e.raridade)):"")+(e.efeito?field("Efeito",esc(e.efeito)):"")):""}
      ${field("Fatos conhecidos",(e.fatos&&e.fatos.length)?`<ul class="fatos">${e.fatos.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"<span class='gvazio'>(nenhum ainda)</span>")}
      ${e.notas?field("Notas",esc(e.notas)):""}
      ${field(rotDiretas(kind)+" ("+diretas.length+")",tagPistas(diretas))}
      ${field("Mencionam em outro lugar ("+mencoes.length+")",tagPistas(mencoes))}
    </div>`;
  d.classList.add("open");
}

function salvarEntidade(){
  if(!_entAtual)return;const kind=_entAtual.kind,nome=_entAtual.nome;
  const g=k=>{const el=document.getElementById('ed-'+k);return el?el.value:'';};
  let novo=g('entnome').trim()||nome;
  if(novo!==nome)renomearEnt(kind,nome,novo);
  const e=acharEnt(entListaDe(kind),novo);if(!e){_entAtual=null;return;}
  e.imagem=g('entimg').trim();
  e.descricao=g('entdesc');
  e.fatos=g('entfatos').split('\n').map(s=>s.trim()).filter(Boolean);
  e.notas=g('entnotas');
  if(kind==="grupo"){var _c=document.getElementById('ed-entcor');if(_c)e.cor=_c.value;}
  _entAtual={kind,nome:novo};
  marcarAlterado();render();abrirEntidade(kind,novo);
}
function excluirEntPainel(){if(!_entAtual)return;const kind=_entAtual.kind,nome=_entAtual.nome;if(!confirm('Excluir o dossiê de "'+nome+'" e desvincular das fichas?'))return;excluirEnt(kind,nome);_entAtual=null;fechar();}
function renderMundo(){
  const box=document.getElementById("mundo");if(!box)return;
  const secs=[["sala","Salas",DADOS.salas],["pessoa","Personagens",DADOS.personagens],["grupo","Grupos",DADOS.grupos]];
  box.innerHTML=secs.map(function(sec){
    const kind=sec[0],titulo=sec[1],arr=sec[2];
    const lista=(kind==="sala")?arr.filter(s=>s.descoberta!==false):arr;
    const cards=[...lista].sort((a,b)=>a.nome<b.nome?-1:1).map(e=>{
      const n=pistasQueCitam(kind,e.nome).length;
      const resumo=e.descricao||((e.fatos&&e.fatos[0])||"");
      return `<div class="card" style="border-left-color:${corKind(kind)}" onclick="abrirEntidade('${kind}','${jsq(e.nome)}')">
        <div class="thumbwrap"><span class="ph"><b>${iconKind(kind)}</b>sem imagem</span>${e.imagem?`<img class="thumb" src="${esc(e.imagem)}" onerror="this.remove()">`:""}</div>
        <h3>${esc(e.nome)}</h3>
        ${resumo?`<div class="excerpt">${esc(resumo)}</div>`:""}
        <div class="meta"><span class="pill">🔗 ${n} pista(s)</span>${(e.fatos&&e.fatos.length)?`<span class="pill">📌 ${e.fatos.length} fato(s)</span>`:""}</div>
      </div>`;
    }).join("")||(kind==="sala"?'<div class="gvazio">Nenhuma sala descoberta ainda. Selecione a sala ao cadastrar uma pista para liberá-la.</div>':'<div class="gvazio">(nenhum ainda)</div>');
    const locked=(kind==="sala")?(arr.length-lista.length):0;
    const lockNote=locked>0?` <span class="msecn" title="Salas ainda não descobertas (aparecem ao serem usadas numa pista)">🔒 ${locked}</span>`:"";
    return `<div class="msec"><h2 class="msech">${iconKind(kind)} ${titulo} <span class="msecn">${lista.length}</span>${lockNote}</h2><div class="mgrid">${cards}</div></div>`;
  }).join("");
}
function buildMapToggles(){
  const box=document.getElementById("maptoggles");if(!box)return;
  const defs=[["pessoa","Personagens",COR_PESSOA],["sala","Salas",COR_SALA],["grupo","Grupos",COR_LIVRO],["manual","Conexões",COR_MANUAL]];
  box.innerHTML="";
  defs.forEach(function(dd){const k=dd[0],lab=dd[1],cor=dd[2];
    const c=document.createElement("div");
    c.className="mtog"+(mapLayers[k]?" on":"");c.title="Mostrar/ocultar "+lab+" no mapa";
    c.innerHTML=`<span class="dot" style="background:${cor}"></span>${lab}`;

    box.appendChild(c);

}

  }).join("")||'<div class="gvazio">(sem salas nesta categoria)</div>';

function renderLink(id,q){const base=fichas.find(f=>f.id===id);const box=document.getElementById("linkLista");if(!base||!box)return;const ql=(q||"").toLowerCase();
  const outras=fichas.filter(f=>f.id!==id&&(f.titulo||"").toLowerCase().includes(ql));
  box.innerHTML=outras.map(f=>{const ja=(base.conexoes||[]).includes(f.id);return `<div class="linkrow" onclick="ligar('${id}','${f.id}')">${ja?"✓ ":""}${esc(f.titulo)}${f.sala?` <small style="opacity:.6">· ${esc(f.sala)}</small>`:""}</div>`;}).join("")||"<div class='gvazio'>(nenhuma ficha)</div>";}
function ligar(a,b){const fa=fichas.find(f=>f.id===a),fb=fichas.find(f=>f.id===b);if(!fa||!fb)return;fa.conexoes=fa.conexoes||[];fb.conexoes=fb.conexoes||[];if(!fa.conexoes.includes(b))fa.conexoes.push(b);if(!fb.conexoes.includes(a))fb.conexoes.push(a);marcarAlterado();renderLink(a,(document.getElementById("linkBusca")||{}).value||"");}
function desligarFicha(a,b){const fa=fichas.find(f=>f.id===a),fb=fichas.find(f=>f.id===b);if(fa)fa.conexoes=(fa.conexoes||[]).filter(x=>x!==b);if(fb)fb.conexoes=(fb.conexoes||[]).filter(x=>x!==a);marcarAlterado();abrir(a);}

function exportarBackup(){const txt=serializeDados();const dt=new Date().toISOString().slice(0,10);const b=new Blob([txt],{type:"text/javascript"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="dados_backup_"+dt+".js";document.body.appendChild(a);a.click();a.remove();toast("Backup baixado ✓",2500);}
function _replaceArr(t,s){if(!t)return;t.length=0;(s||[]).forEach(x=>t.push(x));}
function importarDados(){const inp=document.createElement("input");inp.type="file";inp.accept=".js,.json,text/javascript,application/json";
  inp.onchange=()=>{const file=inp.files&&inp.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const t=rd.result;const o=JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));
    if(!confirm("Restaurar vai SUBSTITUIR os dados atuais pelos do arquivo. Continuar?"))return;
    _replaceArr(DADOS.salas,o.salas);_replaceArr(DADOS.personagens,o.personagens);_replaceArr(DADOS.colecoes,o.colecoes);_replaceArr(fichas,o.fichas);_replaceArr(DADOS.teorias,o.teorias);if(o.tipos&&o.tipos.length)_replaceArr(TIPOS,o.tipos);
    marcarAlterado();buildChips();rebuildFilters();render();toast("Dados restaurados ✓",3000);
  }catch(e){alert("Não consegui ler esse arquivo como dados.js válido.");}};rd.readAsText(file);};
  inp.click();}

/* -- Paleta (Ctrl+K) -- */
function abrirPalette(){let m=document.getElementById("palette");if(!m){m=document.createElement("div");m.id="palette";m.className="modal";document.body.appendChild(m);}
  m.innerHTML=`<div class="modalbox" style="max-width:560px"><div class="modalhd"><h2>⌨️ Ir para…</h2><button class="close" onclick="fecharPalette()">✕</button></div><div class="savehelp"><input id="palBusca" class="edinput" placeholder="Buscar ficha, sala, personagem, coleção..." oninput="renderPalette(this.value)"><div id="palLista" class="linklista"></div></div></div>`;
  m.classList.add("open");renderPalette("");setTimeout(()=>{const b=document.getElementById("palBusca");if(b)b.focus();},60);}
function renderPalette(q){const box=document.getElementById("palLista");if(!box)return;const ql=(q||"").toLowerCase();const its=[];
  fichas.forEach(f=>its.push({t:"🗂 "+f.titulo,k:"pista",go:"abrir('"+f.id+"')",nome:f.titulo}));
  DADOS.salas.filter(s=>s.descoberta!==false).forEach(s=>its.push({t:"🚪 "+s.nome,go:"abrirEntidade('sala','"+jsq(s.nome)+"')",nome:s.nome}));
  DADOS.personagens.forEach(s=>its.push({t:"👤 "+s.nome,go:"abrirEntidade('pessoa','"+jsq(s.nome)+"')",nome:s.nome}));
  DADOS.grupos.forEach(s=>its.push({t:"📦 "+s.nome,go:"abrirEntidade('grupo','"+jsq(s.nome)+"')",nome:s.nome}));
  const f=its.filter(x=>x.nome.toLowerCase().includes(ql)).slice(0,40);
  box.innerHTML=f.map(x=>`<div class="linkrow" onclick="fecharPalette();${x.go}">${esc(x.t)}</div>`).join("")||"<div class='gvazio'>(nada)</div>";}
function fecharPalette(){const m=document.getElementById("palette");if(m)m.classList.remove("open");}
/* -- Teorias -- */
let _qIdx=0,_qSel=null,_qDrag=null,_qPan=null,_qArrow=null,_qArrowCur=null;
function quadroAtual(){return (DADOS.quadros&&DADOS.quadros[_qIdx])||null;}
function renderTeorias(){
  const box=document.getElementById("teorias");if(!box)return;
  if(!DADOS.quadros||!DADOS.quadros.length)DADOS.quadros=[{nome:"Quadro 1",cam:{x:40,y:40,s:1},nodes:[],setas:[]}];
  if(_qIdx>=DADOS.quadros.length)_qIdx=0;
  const tabs=DADOS.quadros.map((q,i)=>`<button class="qtab${i===_qIdx?' active':''}" ondblclick="renomearQuadro(${i})" onclick="trocarQuadro(${i})" title="Clique para abrir · 2 cliques para renomear">${esc(q.nome)}</button>`).join("");
  box.innerHTML=`<div class="qbar">
    <div class="qtabs">${tabs}<button class="qtab qadd" onclick="novoQuadro()" title="Novo quadro">＋</button></div>
    <div class="qtools"><button class="topbtn" onclick="qAddItem()">➕ Item</button><button class="topbtn" onclick="qAddTexto()">📝 Caixa de texto</button><button class="topbtn" onclick="excluirQuadro()" title="Excluir este quadro">🗑 Quadro</button><span class="dica" style="margin-left:auto">Arraste o fundo p/ mover · roda = zoom · arraste a alça ● p/ ligar · 2 cliques num item p/ abrir</span></div>
  </div>
  <div class="qcanvas" id="qcanvas"><div class="qworld" id="qworld"><svg class="qsvg" id="qsvg"></svg><div class="qnodes" id="qnodes"></div></div></div>`;
  wireQuadro();desenhaQuadro();
}
function trocarQuadro(i){_qIdx=i;_qSel=null;renderTeorias();}
function novoQuadro(){DADOS.quadros.push({nome:"Quadro "+(DADOS.quadros.length+1),cam:{x:40,y:40,s:1},nodes:[],setas:[]});_qIdx=DADOS.quadros.length-1;marcarAlterado();renderTeorias();}
function renomearQuadro(i){const nv=prompt("Nome do quadro:",DADOS.quadros[i].nome);if(nv&&nv.trim()){DADOS.quadros[i].nome=nv.trim();marcarAlterado();renderTeorias();}}
function excluirQuadro(){if(DADOS.quadros.length<=1){alert("Precisa ter pelo menos um quadro.");return;}if(!confirm("Excluir o quadro \""+quadroAtual().nome+"\"?"))return;DADOS.quadros.splice(_qIdx,1);_qIdx=0;marcarAlterado();renderTeorias();}
function qRefInfo(n){if(n.kind==="pista"){const f=fichas.find(x=>x.id===n.ref);return {icon:"🗂",nome:f?(f.titulo||"(sem título)"):"(removida)",img:f?pg0(f).imagem:""};}const e=acharEnt(entListaDe(n.kind),n.ref);return {icon:n.kind==="sala"?"🚪":n.kind==="grupo"?"📦":n.kind==="colecao"?"📚":"👤",nome:e?e.nome:n.ref,img:e?e.imagem:""};}
function nodeHTML(n){const sel=n.id===_qSel?" sel":"";
  if(n.tipo==="texto"){return `<div class="qnode qtexto${sel}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px;width:${n.w||250}px"><div class="qhandle" data-drag="${n.id}">≡ texto</div><div class="qtxt menteditor" contenteditable="true" data-qid="${n.id}" data-ph="Escreva... use @ para citar" oninput="teoEditorInput(this)">${n.texto||""}</div><span class="qdel" onclick="qDelNode('${n.id}')">✕</span><span class="qconn" data-conn="${n.id}" title="Arraste para ligar">●</span></div>`;}
  const info=qRefInfo(n);
  const thumb=info.img?`<div class="qthumb"><img src="${esc(info.img)}" onerror="this.parentNode.style.display='none'"></div>`:"";
  return `<div class="qnode qref${sel}" data-id="${n.id}" data-drag="${n.id}" style="left:${n.x}px;top:${n.y}px" ondblclick="qOpenRef('${n.id}')">${thumb}<div class="qreftit"><span class="qicon">${info.icon}</span><span class="qname">${esc(info.nome)}</span></div><span class="qdel" onclick="event.stopPropagation();qDelNode('${n.id}')">✕</span><span class="qconn" data-conn="${n.id}" title="Arraste para ligar">●</span></div>`;}
function desenhaQuadro(){const q=quadroAtual();if(!q)return;aplicaCam();const nd=document.getElementById("qnodes");if(nd)nd.innerHTML=q.nodes.map(nodeHTML).join("");desenhaSetas();}
function aplicaCam(){const q=quadroAtual();const w=document.getElementById("qworld");if(w&&q)w.style.transform=`translate(${q.cam.x}px,${q.cam.y}px) scale(${q.cam.s})`;const cv=document.getElementById("qcanvas");if(cv&&q){const gz=(26*q.cam.s).toFixed(2)+"px";const pos=q.cam.x.toFixed(1)+"px "+q.cam.y.toFixed(1)+"px";cv.style.backgroundSize=gz+" "+gz+", "+gz+" "+gz;cv.style.backgroundPosition=pos+", "+pos;}}
function nodeEl(id){return document.querySelector('.qnode[data-id="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');}
function nodeCenter(n){const el=nodeEl(n.id);const w=el?el.offsetWidth:120,hh=el?el.offsetHeight:40;return {x:n.x+w/2,y:n.y+hh/2};}
function desenhaSetas(){const q=quadroAtual();const svg=document.getElementById("qsvg");if(!svg||!q)return;
  let s='<defs><marker id="qar" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#9fc0ff"/></marker></defs>';
  q.setas.forEach(function(se,i){const a=q.nodes.find(n=>n.id===se.de),b=q.nodes.find(n=>n.id===se.para);if(!a||!b)return;const ca=nodeCenter(a),cb=nodeCenter(b);
    s+=`<line x1="${ca.x}" y1="${ca.y}" x2="${cb.x}" y2="${cb.y}" stroke="#9fc0ff" stroke-width="2" marker-end="url(#qar)"/>`;
    s+=`<line x1="${ca.x}" y1="${ca.y}" x2="${cb.x}" y2="${cb.y}" stroke="transparent" stroke-width="14" style="pointer-events:stroke;cursor:pointer" onclick="qDelSeta(${i})"><title>Clique para remover</title></line>`;});
  if(_qArrow&&_qArrowCur){const a=q.nodes.find(n=>n.id===_qArrow.de);if(a){const ca=nodeCenter(a);s+=`<line x1="${ca.x}" y1="${ca.y}" x2="${_qArrowCur.x}" y2="${_qArrowCur.y}" stroke="#caa53a" stroke-width="2" stroke-dasharray="5 4"/>`;}}
  svg.innerHTML=s;}
function wireQuadro(){const cv=document.getElementById("qcanvas");if(!cv)return;
  const rel=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
  const toW=p=>{const q=quadroAtual();return {x:(p.x-q.cam.x)/q.cam.s,y:(p.y-q.cam.y)/q.cam.s};};
  cv.addEventListener("mousedown",function(e){const q=quadroAtual();
    const conn=e.target.closest&&e.target.closest("[data-conn]");
    if(conn){_qArrow={de:conn.getAttribute("data-conn")};_qArrowCur=toW(rel(e));e.preventDefault();return;}
    if(e.target.tagName==="TEXTAREA"||e.target.isContentEditable||(e.target.closest&&e.target.closest(".qtxt")))return;
    const dg=e.target.closest&&e.target.closest("[data-drag]");
    if(dg){const id=dg.getAttribute("data-drag");const n=q.nodes.find(x=>x.id===id);if(n){_qSel=id;_qDrag={id,sw:toW(rel(e)),ox:n.x,oy:n.y,moved:false};e.preventDefault();}return;}
    _qPan={mx:rel(e).x,my:rel(e).y,cx:q.cam.x,cy:q.cam.y};_qSel=null;});
  cv.addEventListener("mousemove",function(e){const q=quadroAtual();const p=rel(e);
    if(_qDrag){const w=toW(p);const n=q.nodes.find(x=>x.id===_qDrag.id);if(n){n.x=Math.round(_qDrag.ox+(w.x-_qDrag.sw.x));n.y=Math.round(_qDrag.oy+(w.y-_qDrag.sw.y));_qDrag.moved=true;const el=nodeEl(n.id);if(el){el.style.left=n.x+"px";el.style.top=n.y+"px";}desenhaSetas();}}
    else if(_qPan){q.cam.x=_qPan.cx+(p.x-_qPan.mx);q.cam.y=_qPan.cy+(p.y-_qPan.my);aplicaCam();}
    else if(_qArrow){_qArrowCur=toW(p);desenhaSetas();}});
  window.addEventListener("mouseup",function(e){
    if(_qArrow){const t=e.target.closest&&e.target.closest(".qnode");if(t){const para=t.getAttribute("data-id");if(para&&para!==_qArrow.de){const q=quadroAtual();if(!q.setas.some(s=>s.de===_qArrow.de&&s.para===para)){q.setas.push({de:_qArrow.de,para:para});marcarAlterado();}}}_qArrow=null;_qArrowCur=null;desenhaSetas();}
    if(_qDrag){if(_qDrag.moved)marcarAlterado();_qDrag=null;}
    if(_qPan){marcarAlterado();_qPan=null;}});
  cv.addEventListener("wheel",function(e){e.preventDefault();const q=quadroAtual();const p=rel(e);const wx=(p.x-q.cam.x)/q.cam.s,wy=(p.y-q.cam.y)/q.cam.s;const f=e.deltaY<0?1.1:1/1.1;q.cam.s=Math.max(0.2,Math.min(3,q.cam.s*f));q.cam.x=p.x-wx*q.cam.s;q.cam.y=p.y-wy*q.cam.s;aplicaCam();},{passive:false});}
function qCentro(){const q=quadroAtual();const cv=document.getElementById("qcanvas");const w=(cv?cv.clientWidth:700),hh=(cv?cv.clientHeight:450);return {x:Math.round((w/2-q.cam.x)/q.cam.s-70),y:Math.round((hh/2-q.cam.y)/q.cam.s-20)};}
function qAddTexto(){const q=quadroAtual();const c=qCentro();q.nodes.push({id:"n"+Date.now(),tipo:"texto",texto:"",x:c.x,y:c.y,w:250});marcarAlterado();desenhaQuadro();}
function qSetTexto(id,v){const n=quadroAtual().nodes.find(x=>x.id===id);if(n){n.texto=v;marcarAlterado();}}
function qDelNode(id){const q=quadroAtual();q.nodes=q.nodes.filter(n=>n.id!==id);q.setas=q.setas.filter(s=>s.de!==id&&s.para!==id);marcarAlterado();desenhaQuadro();}
function qDelSeta(i){const q=quadroAtual();q.setas.splice(i,1);marcarAlterado();desenhaSetas();}
function qOpenRef(id){const n=quadroAtual().nodes.find(x=>x.id===id);if(!n||n.tipo!=="ref")return;if(n.kind==="pista")abrir(n.ref);else abrirEntidade(n.kind,n.ref);}
function qAddItem(){let m=document.getElementById("qpick");if(!m){m=document.createElement("div");m.id="qpick";m.className="modal";document.body.appendChild(m);}
  m.innerHTML=`<div class="modalbox" style="max-width:520px"><div class="modalhd"><h2>➕ Adicionar ao quadro</h2><button class="close" onclick="fecharQPick()">✕</button></div><div class="savehelp"><input id="qpBusca" class="edinput" placeholder="Buscar pista, sala, personagem, coleção..." oninput="qPickRender(this.value)"><div id="qpLista" class="linklista"></div></div></div>`;
  m.classList.add("open");qPickRender("");setTimeout(()=>{const b=document.getElementById("qpBusca");if(b)b.focus();},50);}
function qPickItens(qq){const ql=(qq||"").toLowerCase();const out=[];
  fichas.forEach(f=>out.push({k:"pista",ic:"🗂",ref:f.id,nome:f.titulo||"(sem título)"}));
  DADOS.salas.filter(s=>s.descoberta!==false).forEach(s=>out.push({k:"sala",ic:"🚪",ref:s.nome,nome:s.nome}));
  DADOS.personagens.forEach(s=>out.push({k:"pessoa",ic:"👤",ref:s.nome,nome:s.nome}));
  DADOS.grupos.forEach(s=>out.push({k:"grupo",ic:"📦",ref:s.nome,nome:s.nome}));
  return out.filter(x=>(x.nome||"").toLowerCase().includes(ql)).slice(0,50);}
function qPickRender(qq){const box=document.getElementById("qpLista");if(!box)return;box.innerHTML=qPickItens(qq).map(x=>`<div class="linkrow" onclick="qAddRef('${x.k}','${jsq(x.ref)}')">${x.ic} ${esc(x.nome)}</div>`).join("")||"<div class='gvazio'>(nada)</div>";}
function qAddRef(kind,ref){const q=quadroAtual();const c=qCentro();q.nodes.push({id:"n"+Date.now()+Math.floor(Math.random()*999),tipo:"ref",kind:kind,ref:ref,x:c.x,y:c.y});marcarAlterado();fecharQPick();desenhaQuadro();}
function fecharQPick(){const m=document.getElementById("qpick");if(m)m.classList.remove("open");}
function novaTeoria(){DADOS.teorias.push({titulo:"Nova teoria",texto:""});marcarAlterado();renderTeorias();}
function setTeoria(i,campo,val){if(DADOS.teorias[i]){DADOS.teorias[i][campo]=val;marcarAlterado();}}
/* ---- mencoes @ nas teorias ---- */
let _mentEditor=null,_mentNode=null,_mentStart=0,_mentEnd=0,_mentList=[];
function saveTeoEditor(ed){const i=+ed.dataset.i;if(DADOS.teorias[i]){DADOS.teorias[i].texto=ed.innerHTML;marcarAlterado();}}
function mentItens(q){const ql=(q||"").toLowerCase();const out=[];
  fichas.forEach(f=>out.push({k:"pista",icon:"🗂",ref:f.id,nome:f.titulo||"(sem título)"}));
  DADOS.salas.filter(s=>s.descoberta!==false).forEach(s=>out.push({k:"sala",icon:"🚪",ref:s.nome,nome:s.nome}));
  DADOS.personagens.forEach(s=>out.push({k:"pessoa",icon:"👤",ref:s.nome,nome:s.nome}));
  DADOS.grupos.forEach(s=>out.push({k:"grupo",icon:"📦",ref:s.nome,nome:s.nome}));
  return out.filter(x=>(x.nome||"").toLowerCase().includes(ql)).slice(0,40);}
function mentSave(ed){if(ed.dataset&&ed.dataset.qid){qSetTexto(ed.dataset.qid,ed.innerHTML);}else{saveTeoEditor(ed);}}
function teoEditorInput(ed){
  mentSave(ed);
  const sel=window.getSelection();if(!sel||!sel.rangeCount){hideMent();return;}
  const r=sel.getRangeAt(0);const node=r.startContainer;
  if(!node||node.nodeType!==3){hideMent();return;}
  const before=node.textContent.slice(0,r.startOffset);
  const m=before.match(/@([^\s@]{0,30})$/);
  if(!m){hideMent();return;}
  _mentEditor=ed;_mentNode=node;_mentEnd=r.startOffset;_mentStart=r.startOffset-m[0].length;
  showMent(m[1],r);
}
function showMent(q,range){
  let mu=document.getElementById("mentMenu");if(!mu){mu=document.createElement("div");mu.id="mentMenu";mu.className="mentmenu";document.body.appendChild(mu);}
  _mentList=mentItens(q);
  mu.innerHTML=_mentList.map((x,idx)=>`<div class="mentit" data-idx="${idx}">${x.icon} ${esc(x.nome)} <small>${x.k}</small></div>`).join("")||"<div class='gvazio' style='padding:8px'>(nada encontrado)</div>";
  let rect={left:40,bottom:120};try{rect=range.getBoundingClientRect();}catch(e){}
  mu.style.left=(rect.left||40)+"px";mu.style.top=((rect.bottom||120)+4)+"px";mu.style.display="block";
  mu.querySelectorAll(".mentit[data-idx]").forEach(el=>el.onclick=()=>escolherMent(+el.dataset.idx));
}
function hideMent(){const mu=document.getElementById("mentMenu");if(mu)mu.style.display="none";}
function escolherMent(idx){
  const x=_mentList[idx];if(!x||!_mentEditor||!_mentNode)return;
  const r=document.createRange();r.setStart(_mentNode,_mentStart);r.setEnd(_mentNode,_mentEnd);r.deleteContents();
  const span=document.createElement("span");span.className="ment";span.contentEditable="false";span.dataset.kind=x.k;span.dataset.ref=x.ref;span.textContent=x.icon+" "+x.nome;
  r.insertNode(span);
  const sp=document.createTextNode(" ");span.parentNode.insertBefore(sp,span.nextSibling);
  try{const sel=window.getSelection();const nr=document.createRange();nr.setStartAfter(sp);nr.collapse(true);sel.removeAllRanges();sel.addRange(nr);}catch(e){}
  hideMent();mentSave(_mentEditor);
}
function abrirMencao(k,ref){if(k==="pista")abrir(ref);else abrirEntidade(k,ref);}
document.addEventListener("click",function(e){
  const m=e.target.closest&&e.target.closest(".ment");
  if(m){abrirMencao(m.dataset.kind,m.dataset.ref);return;}
  const mu=document.getElementById("mentMenu");
  if(mu&&mu.style.display==="block"&&!(e.target.closest&&e.target.closest("#mentMenu"))&&!(e.target.closest&&e.target.closest(".teotxt"))&&!(e.target.closest&&e.target.closest(".qtxt")))hideMent();
});
function excluirTeoria(i){if(!confirm("Excluir esta teoria?"))return;DADOS.teorias.splice(i,1);marcarAlterado();renderTeorias();}
/* -- Folhear colecao ordenada -- */
function abrirLeitor(col){_leitor={col,i:0};let m=document.getElementById("leitor");if(!m){m=document.createElement("div");m.id="leitor";m.className="modal";document.body.appendChild(m);}m.classList.add("open");renderLeitor();}
function leitorPaginas(){return fichas.filter(f=>(f.colecoes||[]).includes(_leitor.col)).sort((a,b)=>(a.ordem||999)-(b.ordem||999));}
function leitorNav(d){const ps=leitorPaginas();_leitor.i=Math.max(0,Math.min(ps.length-1,_leitor.i+d));renderLeitor();}
function renderLeitor(){const m=document.getElementById("leitor");if(!m)return;const ps=leitorPaginas();const f=ps[_leitor.i];
  m.innerHTML=`<div class="modalbox" style="max-width:760px"><div class="modalhd"><h2>📖 ${esc(_leitor.col)} — ${ps.length?(_leitor.i+1):0}/${ps.length}</h2><button class="close" onclick="fecharLeitor()">✕</button></div>
    <div class="leitorbody">${f?`${pg0(f).imagem?`<img src="${esc(pg0(f).imagem)}" class="leitorimg" style="cursor:zoom-in" onclick="abrirLightbox(this.src)" onerror="this.style.display='none'">`:""}<h3>${esc(f.titulo)}</h3><div class="twocol"><div><div class="lab">Original (EN)</div><div class="orig">${esc(pg0(f).original||"—")}</div></div><div><div class="lab">Tradução (PT)</div><div class="trad">${esc(pg0(f).traducao||"—")}</div></div></div>`:"<div class='gvazio'>(coleção vazia)</div>"}</div>
    <div class="leitornav"><button class="dbtn" onclick="leitorNav(-1)" ${_leitor.i<=0?"disabled":""}>◀ Anterior</button><button class="dbtn" onclick="leitorNav(1)" ${_leitor.i>=ps.length-1?"disabled":""}>Próxima ▶</button></div></div>`;}
function fecharLeitor(){const m=document.getElementById("leitor");if(m)m.classList.remove("open");}
function render(){ atualizarBarra(); if(state.view==="grade")renderGrade(); else if(state.view==="mapa")renderMapa(); else if(state.view==="mundo")renderMundo(); else if(state.view==="diretorio")renderDiretorio(); else if(state.view==="teorias")renderTeorias(); }
render();
reconectarAoCarregar().then(function(){return lerMtime();}).then(function(m){if(m)_diskMtime=m;});
snapshotDB(true);
if(DADOS_BROKEN){ try{setAuto(false);}catch(e){} abrirRecuperacao(); }
window.addEventListener("focus",async function(){ try{ if(fileHandle&&autoSave&&!DADOS_BROKEN&&await discoMudou())bannerDisco(); }catch(e){} });
</script>
